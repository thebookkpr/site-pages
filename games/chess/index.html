<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess</title>
  <link rel="stylesheet" href="cs/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" defer></script>
  <script src="js/game.js" defer></script>
</head>
<body>
  <main class="game">
    <h1>Chess</h1>
    <p id="status" class="status" aria-live="polite">Loading…</p>

    <div id="board" class="board" role="grid" aria-label="Chess board"></div>

    <div class="controls">
      <button id="undo" type="button">Undo move</button>
      <button id="reset" type="button">New game</button>
    </div>
    <p class="help">Click a piece, then click a highlighted square to move it.</p>
  </main>
</body>
</html>
