<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volunteer log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap">
<style>
:root{--bg:#f2f6f5;--card:#fff;--ink:#1c2a33;--mute:#5d6f78;--line:#d3dedb;--accent:#2b6f68;--accent-ink:#fff;--total:#e7f1ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141c20;--card:#1c272c;--ink:#e6eeec;--mute:#93a7a6;--line:#2f3f45;--accent:#5bb5aa;--accent-ink:#0f1a1c;--total:#223338}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 28px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
h2{font:700 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 12px}
a,a:visited,a:hover,a:active{color:var(--accent)}
.sub{color:var(--mute);margin:0 0 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
button{font:inherit;font-weight:700;border-radius:8px;min-height:44px;padding:0 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:8px;margin:0 0 16px}
.tabs button{flex:1;padding:0 4px;font-size:14px;background:var(--card);color:var(--ink);border-color:var(--line)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:440px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:14px}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:var(--total);border-bottom:0}
.empty{color:var(--mute);margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.big{font:700 34px/1 Georgia,"Times New Roman",serif;color:var(--accent)}
.sum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
details{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--bg)}
summary{cursor:pointer;padding:12px 14px;min-height:44px;display:flex;justify-content:space-between;gap:10px;font-weight:700}
summary span.t{color:var(--accent);white-space:nowrap}
.inner{padding:0 14px 14px}
[hidden]{display:none!important}
@media print{body{background:#fff;color:#000}section{border:0;padding:0;background:#fff}.noprint,.actions{display:none!important}.paper{border:0!important;padding:0!important}.f input::placeholder{color:transparent}}
</style>
<style id="formcss"></style>
</head>
<body>
<main>
<h1 class="noprint">Volunteer log</h1>
<p class="sub noprint"><a href="./">Back to the timesheet</a>. This page shows what you add there and updates on its own. It only sees entries saved in this same browser.</p>

<div class="tabs noprint" role="tablist">
<button type="button" role="tab" id="tab-cur" aria-selected="true">Current</button>
<button type="button" role="tab" id="tab-past" aria-selected="false">History (<span id="pastn">0</span>)</button>
</div>

<div id="view-cur">
<section>
<div class="sum noprint"><span class="big" id="total">0h 0m</span><span class="sub" style="margin:0" id="count">No days added yet</span></div>
<div id="formwrap"></div>
<div class="actions">
<button id="dlform" type="button">Download printable form</button>
<button class="ghost" id="print" type="button">Print</button>
<button class="ghost" id="copy" type="button">Copy as text</button>
<button class="ghost" id="txt" type="button">Download .txt</button>
</div>
<p class="sub noprint" id="msg" style="margin:10px 0 0" aria-live="polite"></p>
</section>
</div>

<div id="view-past" hidden>
<section>
<h2>History</h2>
<div id="pastlist"></div>
<p class="sub" id="pmsg" style="margin:10px 0 0" aria-live="polite"></p>
</section>
</div>
</main>
<script>
(function(){
var KEY="volunteer-timesheet-v1",FKEY="site-pages-volunteer-form-v1";
var state={name:"",org:"",entries:[],history:[]},form={name:"",id:"",dept:"",sup:"",desc:""},last="__init__";
var $=function(i){return document.getElementById(i)};

var FORMCSS=
'.paper{background:#fff;color:#1b2a41;border:1px solid #d9d2bd;border-radius:6px;padding:28px 22px;font-family:Georgia,"Times New Roman",serif;line-height:1.4}'+
'.paper *{box-sizing:border-box}'+
'.paper .hd{text-align:center;margin-bottom:16px}'+
'.paper .hotel{font-size:24px;font-weight:700;letter-spacing:.12em;line-height:1.2}'+
'.paper .loc{font-size:12px;letter-spacing:.22em;margin-top:6px;color:#6b5a2a}'+
'.paper .rule{border-top:3px double #9a7b2f;margin:14px auto;width:70%}'+
'.paper .prog{font-size:13px;letter-spacing:.16em;font-weight:700}'+
'.paper .ttl{font-size:16px;letter-spacing:.12em;margin-top:6px}'+
'.paper h3{font-size:12px;letter-spacing:.18em;font-weight:700;color:#6b5a2a;border-bottom:1px solid #c9bd96;padding-bottom:4px;margin:22px 0 10px;font-family:Georgia,"Times New Roman",serif}'+
'.paper .f{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 10px;margin:0 0 10px}'+
'.paper .fl{font-weight:700;font-size:14px;flex:0 0 190px}'+
'.paper .fv,.paper .f input{flex:1 1 200px;min-width:0;font:inherit;font-size:16px;border:0;border-bottom:1px solid #8c93a1;background:transparent;color:#1b2a41;padding:2px;border-radius:0;min-height:30px}'+
'.paper .f input{min-height:40px}'+
'.paper .f input:focus{outline:2px solid #9a7b2f;outline-offset:1px}'+
'.paper .b{font-weight:700}'+
'.paper .sig{font-family:"Great Vibes","Snell Roundhand","Apple Chancery","Brush Script MT",cursive;font-size:36px;line-height:1.1;min-height:44px;padding-top:0}'+
'.paper .scroll{overflow-x:auto}'+
'.paper table{width:100%;border-collapse:collapse;min-width:440px;font-size:15px}'+
'.paper th{background:#efe9d6;color:#1b2a41;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border:1px solid #b9ad82;padding:8px;text-align:left}'+
'.paper td{border:1px solid #cfc6a6;padding:8px;vertical-align:top;color:#1b2a41;background:#fff}'+
'.paper td.n,.paper th.n{text-align:right;white-space:nowrap}'+
'.paper tfoot td{font-weight:700;background:#efe9d6}'+
'.paper .desc{width:100%;min-height:96px;font:inherit;font-size:16px;color:#1b2a41;background:#fff;border:1px solid #b9ad82;border-radius:4px;padding:8px}'+
'.paper .descv{white-space:pre-wrap;min-height:70px;border-bottom:1px solid #8c93a1;padding:2px}'+
'.paper .foot{text-align:center;font-size:11px;letter-spacing:.22em;color:#6b5a2a;margin-top:26px;border-top:3px double #9a7b2f;padding-top:12px}';
$("formcss").textContent=FORMCSS;

function mins(t){var a=t.split(":");return (+a[0])*60+(+a[1])}
function fmt(m){return Math.floor(m/60)+"h "+(m%60)+"m"}
function d2(d){var a=d.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function fmtDate(d){return d2(d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})}
function fmtDay(d){return d2(d).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}
function fmtTime(t){var a=t.split(":"),h=+a[0],ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+a[1]+" "+ap}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sortE(a){a.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:mins(x.start)-mins(y.start)})}
function sumE(a){var t=0;a.forEach(function(e){t+=e.mins});return t}
function today(){return new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}
function nameOf(){return String(form.name||state.name||"").trim()||"Book Keeper"}
function autoDesc(a){var seen={},o=[];a.forEach(function(e){var t=(e.task||"").trim(),k=t.toLowerCase();if(t&&!seen[k]){seen[k]=1;o.push(t)}});return o.join("; ")}
function range(a){if(!a.length)return "";var f=a[0].date,l=a[a.length-1].date;return f===l?fmtDay(f):fmtDay(f)+" – "+fmtDay(l)}
function opts(a,cur){return {name:nameOf(),id:form.id||"",dept:form.dept||"",sup:form.sup||"",desc:cur?(form.desc||autoDesc(a)):autoDesc(a)}}

function table(a){
 var h='<div class="scroll"><table><thead><tr><th>Date</th><th>Time</th><th>Task</th><th class="n">Hours</th></tr></thead><tbody>';
 a.forEach(function(e){h+="<tr><td>"+esc(fmtDate(e.date))+"</td><td>"+fmtTime(e.start)+" – "+fmtTime(e.end)+"</td><td>"+esc(e.task||"")+'</td><td class="n">'+(e.mins/60).toFixed(2)+"</td></tr>"});
 return h+'</tbody><tfoot><tr><td colspan="3">Total</td><td class="n">'+(sumE(a)/60).toFixed(2)+"</td></tr></tfoot></table></div>";
}

function formHTML(a,o,edit){
 var tot=sumE(a);
 function fld(l,k,v,cls,ph){
  return '<div class="f"><span class="fl">'+l+'</span>'+(edit?'<input class="'+(cls||"")+'" data-k="'+k+'" value="'+esc(v)+'" placeholder="'+esc(ph||"")+'" autocomplete="off" aria-label="'+l+'">':'<span class="fv '+(cls||"")+'">'+(v?esc(v):"&nbsp;")+'</span>')+'</div>';
 }
 function stat(l,v,cls,id){
  return '<div class="f"><span class="fl">'+l+'</span><span class="fv '+(cls||"")+'"'+(id?' id="'+id+'"':"")+'>'+(v?esc(v):"&nbsp;")+'</span></div>';
 }
 var rows="";
 if(a.length){a.forEach(function(e){rows+="<tr><td>"+esc(fmtDate(e.date))+"</td><td>"+fmtTime(e.start)+"</td><td>"+fmtTime(e.end)+"</td><td>"+esc(e.task||"")+'</td><td class="n">'+(e.mins/60).toFixed(2)+"</td></tr>"})}
 else rows='<tr><td colspan="5">No service recorded yet.</td></tr>';
 return '<div class="paper">'+
 '<div class="hd"><div class="hotel">THE SUNCREST ROYAL HOTEL</div><div class="loc">SURYANAGARA • SURYAN EMPIRE</div><div class="rule"></div><div class="prog">SUNCREST COMMUNITY SERVICE PROGRAM</div><div class="ttl">VOLUNTEER ATTENDANCE &amp; TIMESHEET</div></div>'+
 '<h3>VOLUNTEER INFORMATION</h3>'+
 fld("Volunteer Name","name",o.name,"b","Book Keeper")+
 fld("Volunteer ID","id",o.id,"","")+
 fld("Department / Assignment","dept",o.dept,"","")+
 stat("Service Date",range(a),"","")+
 '<h3>SERVICE RECORD</h3>'+
 '<div class="scroll"><table><thead><tr><th>Date</th><th>Start of service</th><th>End of service</th><th>Task</th><th class="n">Hours</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td colspan="4">Total hours</td><td class="n">'+(tot/60).toFixed(2)+'</td></tr></tfoot></table></div>'+
 '<h3>DESCRIPTION OF VOLUNTEER WORK</h3>'+
 (edit?'<textarea class="desc" data-k="desc" aria-label="Description of volunteer work">'+esc(o.desc)+'</textarea>':'<div class="descv">'+(o.desc?esc(o.desc):"&nbsp;")+'</div>')+
 '<h3>VERIFICATION</h3>'+
 stat("Volunteer Signature",o.name,"sig","sigv")+
 stat("Date Signed",today(),"","")+
 fld("Supervisor's Name","sup",o.sup,"","")+
 stat("Supervisor's Signature","","","")+
 stat("Date Verified","","","")+
 '<div class="foot">COMMUNITY SERVICE • DIGNITY • UNITY</div>'+
 '</div>';
}

function standalone(a,o){
 return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Volunteer Attendance &amp; Timesheet</title>'+
 '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap"><style>@page{margin:14mm}body{margin:0;background:#f3efe3;padding:16px}'+
 FORMCSS+'.paper{max-width:760px;margin:0 auto}@media print{body{background:#fff;padding:0}.paper{border:0;padding:0;max-width:none}}</style></head><body>'+
 formHTML(a,o,false)+'</body></html>';
}

function textOf(a,o,title){
 var t=sumE(a),L=["THE SUNCREST ROYAL HOTEL","SURYANAGARA • SURYAN EMPIRE","SUNCREST COMMUNITY SERVICE PROGRAM","VOLUNTEER ATTENDANCE & TIMESHEET"+(title?" – "+title:""),"","VOLUNTEER INFORMATION","Volunteer Name: "+o.name,"Volunteer ID: "+o.id,"Department / Assignment: "+o.dept,"Service Date: "+range(a),"","SERVICE RECORD"];
 a.forEach(function(e){L.push(fmtDate(e.date)+": "+fmtTime(e.start)+" – "+fmtTime(e.end)+" ("+(e.mins/60).toFixed(2)+" hrs)"+(e.task?" – "+e.task:""))});
 L.push("","Total hours: "+(t/60).toFixed(2)+" ("+fmt(t)+")","","Description of Volunteer Work:",o.desc,"","Volunteer Signature: "+o.name+" (digital)","Date Signed: "+today(),"Supervisor's Name: "+o.sup,"Supervisor's Signature: ____________________","Date Verified: ____________________","","COMMUNITY SERVICE • DIGNITY • UNITY");
 return L.join("\n");
}

function copy(txt,el){
 function done(ok){el.textContent=ok?"Copied to clipboard.":"Couldn't copy. Use Download instead."}
 try{navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}
}
function saveFile(name,data,mime,el,okMsg){
 try{var b=new Blob([data],{type:mime+";charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);el.textContent=okMsg||"Saved."}
 catch(e){el.textContent="Couldn't download here. Try Print instead."}
}
function safe(s){return String(s).replace(/[\\\/:*?"<>|]/g,"-")}

function loadForm(){
 try{var r=localStorage.getItem(FKEY);if(r){var p=JSON.parse(r);if(p&&typeof p==="object"){["name","id","dept","sup","desc"].forEach(function(k){if(typeof p[k]==="string")form[k]=p[k]})}}}catch(e){}
}
function load(){
 var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 if(raw===last)return;last=raw;
 state={name:"",org:"",entries:[],history:[]};
 try{if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.entries)){state.name=p.name||"";state.org=p.org||"";state.entries=p.entries;state.history=Array.isArray(p.history)?p.history:[]}}}catch(e){}
 render();
}
function render(){
 sortE(state.entries);var tot=sumE(state.entries);
 $("total").textContent=fmt(tot);
 $("count").textContent=state.entries.length?state.entries.length+(state.entries.length===1?" entry":" entries")+" · "+(tot/60).toFixed(2)+" hours":"No days added yet";
 $("formwrap").innerHTML=formHTML(state.entries,opts(state.entries,true),true);
 $("pastn").textContent=state.history.length;
 var h="";
 state.history.forEach(function(x,i){
  h+='<details><summary><span>'+esc(x.label)+'</span><span class="t">'+(x.mins/60).toFixed(2)+' hrs</span></summary><div class="inner">'+table(x.entries)+
  '<div class="actions"><button data-act="form" data-h="'+i+'">Download form</button><button class="ghost" data-act="copy" data-h="'+i+'">Copy as text</button><button class="ghost" data-act="txt" data-h="'+i+'">Download .txt</button></div></div></details>';
 });
 $("pastlist").innerHTML=h||'<p class="empty">Nothing saved yet. Finished pay periods appear here after you tap "Save to Past &amp; start new" on the timesheet page.</p>';
}
function tab(w){["cur","past"].forEach(function(k){$("view-"+k).hidden=k!==w;$("tab-"+k).setAttribute("aria-selected",k===w)})}

$("tab-cur").onclick=function(){tab("cur")};
$("tab-past").onclick=function(){tab("past")};
$("formwrap").addEventListener("input",function(ev){
 var k=ev.target.getAttribute("data-k");if(!k)return;
 form[k]=ev.target.value;
 try{localStorage.setItem(FKEY,JSON.stringify(form))}catch(e){}
 if(k==="name"){var s=$("sigv");if(s)s.textContent=nameOf()}
});
$("dlform").onclick=function(){saveFile("Volunteer Timesheet.html",standalone(state.entries,opts(state.entries,true)),"text/html",$("msg"),"Saved. Open the file to print it or save it as a PDF.")};
$("print").onclick=function(){try{window.print()}catch(e){$("msg").textContent="Printing isn't available here. Try Download printable form."}};
$("copy").onclick=function(){copy(textOf(state.entries,opts(state.entries,true)),$("msg"))};
$("txt").onclick=function(){saveFile("Volunteer Timesheet.txt",textOf(state.entries,opts(state.entries,true)),"text/plain",$("msg"))};
$("pastlist").onclick=function(ev){
 var b=ev.target.closest("button[data-act]");if(!b)return;
 var x=state.history[+b.getAttribute("data-h")];if(!x)return;
 var a=x.entries.slice();sortE(a);var o=opts(a,false),act=b.getAttribute("data-act"),nm=safe(x.label);
 if(act==="copy")copy(textOf(a,o,x.label),$("pmsg"));
 else if(act==="txt")saveFile("Volunteer Timesheet - "+nm+".txt",textOf(a,o,x.label),"text/plain",$("pmsg"));
 else saveFile("Volunteer Timesheet - "+nm+".html",standalone(a,o),"text/html",$("pmsg"),"Saved. Open the file to print it or save it as a PDF.");
};
window.addEventListener("storage",function(e){if(!e.key||e.key===KEY)load()});
window.addEventListener("focus",load);
document.addEventListener("visibilitychange",function(){if(!document.hidden)load()});
loadForm();load();
})();
</script>
</body>
</html>
